<svg fill="none" viewBox="0 0 1200 380" width="1200" height="380" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        * {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }

        .banner {
          width: 100%;
          height: 380px;
          background: #070913;
          background-image: 
            radial-gradient(circle at 85% 30%, rgba(30, 58, 138, 0.45) 0%, transparent 60%),
            radial-gradient(circle at 20% 80%, rgba(88, 28, 135, 0.35) 0%, transparent 50%),
            radial-gradient(circle at 50% 20%, rgba(14, 165, 233, 0.2) 0%, transparent 40%);
          border-radius: 16px;
          border: 1px solid rgba(97, 218, 251, 0.35);
          box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7), inset 0 0 60px rgba(97, 218, 251, 0.08);
          position: relative;
          overflow: hidden;
          font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
          color: #ffffff;
          display: flex;
          align-items: center;
          padding: 0 60px;
        }

        /* Dense Starfield */
        .stars-container {
          position: absolute;
          inset: 0;
          pointer-events: none;
        }

        .star {
          position: absolute;
          border-radius: 50%;
          background: #ffffff;
          animation: pulseStar 3s ease-in-out infinite alternate;
        }

        @keyframes pulseStar {
          0% { opacity: 0.2; transform: scale(0.8); }
          50% { opacity: 1; transform: scale(1.4); }
          100% { opacity: 0.4; transform: scale(1); }
        }

        /* Shooting Comet Animation */
        .comet {
          position: absolute;
          width: 140px;
          height: 2px;
          background: linear-gradient(90deg, rgba(255,255,255,0.9), rgba(97, 218, 251, 0.6), transparent);
          transform: rotate(-35deg);
          animation: cometFly 7s linear infinite;
          opacity: 0;
        }

        .comet-1 {
          top: 60px;
          right: 350px;
          animation-delay: 0s;
        }

        .comet-2 {
          top: 140px;
          right: 200px;
          animation-delay: 3.5s;
        }

        @keyframes cometFly {
          0% { transform: translateX(0) translateY(0) rotate(-35deg); opacity: 0; }
          10% { opacity: 1; }
          35% { transform: translateX(-380px) translateY(270px) rotate(-35deg); opacity: 0; }
          100% { opacity: 0; }
        }

        /* Content Left */
        .content {
          z-index: 5;
          max-width: 660px;
        }

        .greeting {
          font-size: 22px;
          font-weight: 600;
          color: #61dafb;
          letter-spacing: 1px;
          margin-bottom: 8px;
          display: flex;
          align-items: center;
          gap: 10px;
          text-shadow: 0 0 15px rgba(97, 218, 251, 0.5);
        }

        .hand {
          display: inline-block;
          animation: wave 2.2s infinite;
          transform-origin: 70% 70%;
        }

        @keyframes wave {
          0%, 100% { transform: rotate(0deg); }
          20% { transform: rotate(14deg); }
          40% { transform: rotate(-8deg); }
          60% { transform: rotate(14deg); }
          80% { transform: rotate(-4deg); }
        }

        .name-title {
          font-size: 42px;
          font-weight: 900;
          line-height: 1.15;
          background: linear-gradient(135deg, #ffffff 0%, #e0f7fc 40%, #61dafb 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
          margin-bottom: 14px;
        }

        /* Typewriter Box */
        .typewriter-card {
          display: inline-flex;
          align-items: center;
          gap: 10px;
          font-family: 'Fira Code', monospace;
          font-size: 19px;
          color: #4fc08d;
          background: rgba(15, 23, 42, 0.75);
          padding: 8px 18px;
          border-radius: 8px;
          border: 1px solid rgba(79, 192, 141, 0.4);
          box-shadow: 0 0 20px rgba(79, 192, 141, 0.2);
          margin-bottom: 24px;
        }

        .cursor {
          display: inline-block;
          width: 8px;
          height: 18px;
          background: #4fc08d;
          animation: blink 0.8s infinite;
        }

        @keyframes blink {
          0%, 100% { opacity: 1; }
          50% { opacity: 0; }
        }

        /* Pure Inline Skill Badges (100% Render Guarantee) */
        .skills-grid {
          display: flex;
          align-items: center;
          gap: 10px;
          flex-wrap: wrap;
        }

        .skill-pill {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 6px 14px;
          border-radius: 20px;
          font-size: 13px;
          font-weight: 700;
          background: rgba(30, 41, 59, 0.85);
          border: 1px solid rgba(255, 255, 255, 0.15);
          box-shadow: 0 4px 10px rgba(0,0,0,0.4);
          animation: floatPill 3.5s ease-in-out infinite alternate;
        }

        .skill-pill:nth-child(1) { animation-delay: 0.0s; border-color: rgba(247, 223, 30, 0.5); color: #f7df1e; }
        .skill-pill:nth-child(2) { animation-delay: 0.4s; border-color: rgba(49, 120, 198, 0.5); color: #3178c6; }
        .skill-pill:nth-child(3) { animation-delay: 0.8s; border-color: rgba(97, 218, 251, 0.5); color: #61dafb; }
        .skill-pill:nth-child(4) { animation-delay: 1.2s; border-color: rgba(79, 192, 141, 0.5); color: #4fc08d; }
        .skill-pill:nth-child(5) { animation-delay: 1.6s; border-color: rgba(51, 153, 51, 0.5); color: #339933; }
        .skill-pill:nth-child(6) { animation-delay: 2.0s; border-color: rgba(71, 162, 72, 0.5); color: #47a248; }
        .skill-pill:nth-child(7) { animation-delay: 2.4s; border-color: rgba(36, 150, 237, 0.5); color: #2496ed; }

        @keyframes floatPill {
          0% { transform: translateY(0px); }
          100% { transform: translateY(-6px); }
        }

        /* Realistic Earth Globe Visual */
        .earth-container {
          position: absolute;
          right: 65px;
          top: 50%;
          transform: translateY(-50%);
          width: 270px;
          height: 270px;
        }

        .earth-globe {
          width: 270px;
          height: 270px;
          border-radius: 50%;
          position: relative;
          overflow: hidden;
          background: radial-gradient(circle at 30% 30%, #4b90e2 0%, #1e40af 35%, #0f172a 80%, #020617 100%);
          box-shadow: 
            0 0 50px rgba(97, 218, 251, 0.5),
            inset -35px -35px 50px rgba(0, 0, 0, 0.95),
            inset 15px 15px 30px rgba(255, 255, 255, 0.5);
          animation: floatEarth 5s ease-in-out infinite alternate;
        }

        @keyframes floatEarth {
          0% { transform: translateY(0) rotate(0deg); }
          100% { transform: translateY(-10px) rotate(3deg); }
        }

        /* Detailed Realistic Continents Layer */
        .continents-map {
          position: absolute;
          width: 200%;
          height: 100%;
          background-image: 
            /* Asia & Europe */
            radial-gradient(ellipse at 25% 35%, #22c55e 0%, #15803d 18%, #166534 30%, transparent 45%),
            radial-gradient(ellipse at 32% 45%, #16a34a 0%, #15803d 15%, transparent 35%),
            /* Americas */
            radial-gradient(ellipse at 70% 30%, #22c55e 0%, #16803d 20%, transparent 40%),
            radial-gradient(ellipse at 78% 60%, #15803d 0%, #166534 25%, transparent 42%),
            /* Australia & Islands */
            radial-gradient(ellipse at 38% 70%, #eab308 0%, #ca8a04 15%, transparent 28%),
            /* Polar Ice Caps */
            radial-gradient(ellipse at 30% 5%, #ffffff 0%, #e2e8f0 12%, transparent 25%),
            radial-gradient(ellipse at 75% 5%, #ffffff 0%, #e2e8f0 12%, transparent 25%),
            radial-gradient(ellipse at 50% 95%, #ffffff 0%, #cbd5e1 15%, transparent 30%);
          opacity: 0.85;
          animation: spinMap 30s linear infinite;
        }

        @keyframes spinMap {
          0% { transform: translateX(0); }
          100% { transform: translateX(-50%); }
        }

        /* Realistic Cloud Swirls */
        .clouds-layer {
          position: absolute;
          width: 200%;
          height: 100%;
          background-image: 
            radial-gradient(ellipse at 20% 25%, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0.3) 15%, transparent 35%),
            radial-gradient(ellipse at 40% 65%, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.2) 20%, transparent 40%),
            radial-gradient(ellipse at 70% 40%, rgba(255,255,255,0.75) 0%, rgba(255,255,255,0.3) 18%, transparent 38%),
            radial-gradient(ellipse at 85% 75%, rgba(255,255,255,0.5) 0%, transparent 30%);
          animation: spinClouds 20s linear infinite;
          opacity: 0.6;
        }

        @keyframes spinClouds {
          0% { transform: translateX(0); }
          100% { transform: translateX(-50%); }
        }

        .atmosphere-glow {
          position: absolute;
          inset: 0;
          border-radius: 50%;
          box-shadow: inset 0 0 30px rgba(97, 218, 251, 0.7);
          pointer-events: none;
        }

        /* Orbit Ring */
        .orbit-line {
          position: absolute;
          right: 30px;
          top: 50%;
          width: 340px;
          height: 110px;
          border: 2px dashed rgba(97, 218, 251, 0.4);
          border-radius: 50%;
          transform: translateY(-50%) rotate(-22deg);
          pointer-events: none;
          animation: pulseOrbit 4s ease-in-out infinite alternate;
        }

        @keyframes pulseOrbit {
          0% { opacity: 0.3; transform: translateY(-50%) rotate(-22deg) scale(0.98); }
          100% { opacity: 0.8; transform: translateY(-50%) rotate(-22deg) scale(1.02); box-shadow: 0 0 20px rgba(97, 218, 251, 0.4); }
        }
      </style>

      <div class="banner">
        <!-- Starfield -->
        <div class="stars-container">
          <div class="star" style="top: 30px; left: 80px; width: 2px; height: 2px; animation-delay: 0s;"></div>
          <div class="star" style="top: 140px; left: 150px; width: 3px; height: 3px; animation-delay: 0.5s;"></div>
          <div class="star" style="top: 70px; left: 300px; width: 2px; height: 2px; animation-delay: 1.2s;"></div>
          <div class="star" style="top: 250px; left: 220px; width: 3px; height: 3px; animation-delay: 0.8s;"></div>
          <div class="star" style="top: 310px; left: 100px; width: 2px; height: 2px; animation-delay: 1.7s;"></div>
          <div class="star" style="top: 40px; left: 500px; width: 3px; height: 3px; animation-delay: 0.3s;"></div>
          <div class="star" style="top: 180px; left: 450px; width: 2px; height: 2px; animation-delay: 1.5s;"></div>
          <div class="star" style="top: 290px; left: 540px; width: 3px; height: 3px; animation-delay: 2.1s;"></div>
          <div class="star" style="top: 90px; left: 700px; width: 2px; height: 2px; animation-delay: 0.6s;"></div>
          <div class="star" style="top: 230px; left: 680px; width: 3px; height: 3px; animation-delay: 1.9s;"></div>
          <div class="star" style="top: 320px; left: 760px; width: 2px; height: 2px; animation-delay: 1.1s;"></div>
          <div class="star" style="top: 50px; left: 900px; width: 3px; height: 3px; animation-delay: 0.4s;"></div>
          <div class="star" style="top: 310px; left: 980px; width: 2px; height: 2px; animation-delay: 1.6s;"></div>
          <div class="star" style="top: 80px; left: 1100px; width: 3px; height: 3px; animation-delay: 0.9s;"></div>
          <div class="star" style="top: 260px; left: 1120px; width: 2px; height: 2px; animation-delay: 2.3s;"></div>
        </div>

        <!-- Comets -->
        <div class="comet comet-1"></div>
        <div class="comet comet-2"></div>

        <!-- Content -->
        <div class="content">
          <div class="greeting">
            Hi Everyone! <span class="hand">👋</span>
          </div>
          <div class="name-title">
            I'm Kunkey from Vietnam 🇻🇳
          </div>
          <div class="typewriter-card">
            &gt; Full-Stack MERN Developer 🚀 <span class="cursor"></span>
          </div>

          <!-- Pure Inline Badges (100% Render Guarantee) -->
          <div class="skills-grid">
            <div class="skill-pill">⚡ JavaScript</div>
            <div class="skill-pill">🔷 TypeScript</div>
            <div class="skill-pill">⚛️ React</div>
            <div class="skill-pill">🟢 Vue.js</div>
            <div class="skill-pill">🚀 Node.js</div>
            <div class="skill-pill">🍃 MongoDB</div>
            <div class="skill-pill">🐳 Docker</div>
          </div>
        </div>

        <!-- Realistic Earth Globe -->
        <div class="orbit-line"></div>
        <div class="earth-container">
          <div class="earth-globe">
            <div class="continents-map"></div>
            <div class="clouds-layer"></div>
            <div class="atmosphere-glow"></div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>