<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#0d1326"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="glow1" cx="85%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#581c87" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#581c87" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="50%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>

    <!-- Name Gradient -->
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f7fc"/>
      <stop offset="100%" stop-color="#61dafb"/>
    </linearGradient>

    <!-- Comet Gradient -->
    <linearGradient id="cometGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#61dafb" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#61dafb" stop-opacity="0"/>
    </linearGradient>

    <!-- Earth Globe Gradient -->
    <radialGradient id="earthGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="30%" stop-color="#2563eb"/>
      <stop offset="70%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </radialGradient>

    <!-- Atmosphere Glow -->
    <radialGradient id="atmoGlow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#61dafb" stop-opacity="0"/>
      <stop offset="100%" stop-color="#61dafb" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <style>
    .star { animation: pulseStar 3s ease-in-out infinite alternate; }
    @keyframes pulseStar {
      0% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.4); }
      100% { opacity: 0.4; transform: scale(1); }
    }
    .comet { animation: cometFly 6s linear infinite; }
    @keyframes cometFly {
      0% { opacity: 0; transform: translate(0, 0); }
      10% { opacity: 1; }
      40% { opacity: 0; transform: translate(-300px, 200px); }
      100% { opacity: 0; transform: translate(-300px, 200px); }
    }
    .cursor { animation: blink 0.8s infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .orbit { animation: pulseOrbit 4s ease-in-out infinite alternate; }
    @keyframes pulseOrbit {
      0% { opacity: 0.3; transform: scale(0.98); }
      100% { opacity: 0.8; transform: scale(1.02); }
    }
    .text-greeting { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 600; fill: #61dafb; }
    .text-name { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 42px; font-weight: 900; fill: url(#nameGrad); }
    .text-code { font-family: 'Fira Code', 'Courier New', monospace; font-size: 18px; fill: #4fc08d; font-weight: 600; }
    .pill-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 13px; font-weight: 700; }
  </style>

  <!-- Card Frame -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" stroke="#61dafb" stroke-opacity="0.35" stroke-width="1.5"/>
  <rect width="1200" height="380" rx="16" fill="url(#glow1)"/>
  <rect width="1200" height="380" rx="16" fill="url(#glow2)"/>
  <rect width="1200" height="380" rx="16" fill="url(#glow3)"/>

  <!-- Stars -->
  <circle cx="80" cy="40" r="1.5" fill="#ffffff" class="star" style="animation-delay: 0s;"/>
  <circle cx="150" cy="140" r="2" fill="#ffffff" class="star" style="animation-delay: 0.5s;"/>
  <circle cx="300" cy="70" r="1.5" fill="#ffffff" class="star" style="animation-delay: 1.2s;"/>
  <circle cx="220" cy="250" r="2" fill="#ffffff" class="star" style="animation-delay: 0.8s;"/>
  <circle cx="100" cy="310" r="1.5" fill="#ffffff" class="star" style="animation-delay: 1.7s;"/>
  <circle cx="500" cy="50" r="2" fill="#ffffff" class="star" style="animation-delay: 0.3s;"/>
  <circle cx="450" cy="180" r="1.5" fill="#ffffff" class="star" style="animation-delay: 1.5s;"/>
  <circle cx="540" cy="290" r="2" fill="#ffffff" class="star" style="animation-delay: 2.1s;"/>
  <circle cx="700" cy="90" r="1.5" fill="#ffffff" class="star" style="animation-delay: 0.6s;"/>
  <circle cx="680" cy="230" r="2" fill="#ffffff" class="star" style="animation-delay: 1.9s;"/>
  <circle cx="760" cy="320" r="1.5" fill="#ffffff" class="star" style="animation-delay: 1.1s;"/>
  <circle cx="900" cy="50" r="2" fill="#ffffff" class="star" style="animation-delay: 0.4s;"/>
  <circle cx="980" cy="310" r="1.5" fill="#ffffff" class="star" style="animation-delay: 1.6s;"/>
  <circle cx="1100" cy="80" r="2" fill="#ffffff" class="star" style="animation-delay: 0.9s;"/>
  <circle cx="1120" cy="260" r="1.5" fill="#ffffff" class="star" style="animation-delay: 2.3s;"/>

  <!-- Comets -->
  <g class="comet" style="animation-delay: 0s;">
    <rect x="800" y="60" width="120" height="2" rx="1" fill="url(#cometGrad)" transform="rotate(-30 800 60)"/>
  </g>
  <g class="comet" style="animation-delay: 3s;">
    <rect x="950" y="140" width="100" height="2" rx="1" fill="url(#cometGrad)" transform="rotate(-30 950 140)"/>
  </g>

  <!-- Left Content -->
  <!-- Greeting -->
  <text x="60" y="95" class="text-greeting">Hi Everyone! 👋</text>

  <!-- Title -->
  <text x="60" y="145" class="text-name">I'm Kunkey from Vietnam 🇻🇳</text>

  <!-- Typewriter box -->
  <g transform="translate(60, 175)">
    <rect width="450" height="42" rx="8" fill="#0f172a" fill-opacity="0.8" stroke="#4fc08d" stroke-opacity="0.4" stroke-width="1"/>
    <text x="18" y="27" class="text-code">&gt; Full-Stack MERN Developer 🚀</text>
    <rect x="365" y="12" width="8" height="18" fill="#4fc08d" class="cursor"/>
  </g>

  <!-- Skill Pills -->
  <g transform="translate(60, 245)">
    <!-- Pill 1: JS -->
    <g transform="translate(0, 0)">
      <rect width="115" height="34" rx="17" fill="#1e293b" fill-opacity="0.9" stroke="#f7df1e" stroke-opacity="0.6" stroke-width="1"/>
      <text x="15" y="22" class="pill-text" fill="#f7df1e">⚡ JavaScript</text>
    </g>
    <!-- Pill 2: TS -->
    <g transform="translate(125, 0)">
      <rect width="115" height="34" rx="17" fill="#1e293b" fill-opacity="0.9" stroke="#3178c6" stroke-opacity="0.6" stroke-width="1"/>
      <text x="15" y="22" class="pill-text" fill="#3178c6">🔷 TypeScript</text>
    </g>
    <!-- Pill 3: React -->
    <g transform="translate(250, 0)">
      <rect width="95" height="34" rx="17" fill="#1e293b" fill-opacity="0.9" stroke="#61dafb" stroke-opacity="0.6" stroke-width="1"/>
      <text x="15" y="22" class="pill-text" fill="#61dafb">⚛️ React</text>
    </g>
    <!-- Pill 4: Vue.js -->
    <g transform="translate(355, 0)">
      <rect width="95" height="34" rx="17" fill="#1e293b" fill-opacity="0.9" stroke="#4fc08d" stroke-opacity="0.6" stroke-width="1"/>
      <text x="15" y="22" class="pill-text" fill="#4fc08d">🟢 Vue.js</text>
    </g>
    <!-- Pill 5: Node.js -->
    <g transform="translate(460, 0)">
      <rect width="100" height="34" rx="17" fill="#1e293b" fill-opacity="0.9" stroke="#339933" stroke-opacity="0.6" stroke-width="1"/>
      <text x="15" y="22" class="pill-text" fill="#339933">🚀 Node.js</text>
    </g>
  </g>

  <g transform="translate(60, 290)">
    <!-- Pill 6: MongoDB -->
    <g transform="translate(0, 0)">
      <rect width="115" height="34" rx="17" fill="#1e293b" fill-opacity="0.9" stroke="#47a248" stroke-opacity="0.6" stroke-width="1"/>
      <text x="15" y="22" class="pill-text" fill="#47a248">🍃 MongoDB</text>
    </g>
    <!-- Pill 7: Docker -->
    <g transform="translate(125, 0)">
      <rect width="100" height="34" rx="17" fill="#1e293b" fill-opacity="0.9" stroke="#2496ed" stroke-opacity="0.6" stroke-width="1"/>
      <text x="15" y="22" class="pill-text" fill="#2496ed">🐳 Docker</text>
    </g>
  </g>

  <!-- Right Graphic: Earth Globe & Orbit Ring -->
  <g transform="translate(980, 190)">
    <!-- Orbit Ellipse -->
    <ellipse cx="0" cy="0" rx="170" ry="55" fill="none" stroke="#61dafb" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="6,6" transform="rotate(-22)" class="orbit"/>
    
    <!-- Earth Globe -->
    <circle cx="0" cy="0" r="125" fill="url(#earthGrad)" stroke="#61dafb" stroke-opacity="0.4" stroke-width="1.5"/>

    <!-- Continents Shapes -->
    <path d="M-60,-40 Q-20,-70 20,-50 T60,-10 Q40,40 -20,60 T-70,10 Z" fill="#22c55e" fill-opacity="0.75"/>
    <path d="M10,-80 Q50,-90 70,-60 T40,-30 Z" fill="#16a34a" fill-opacity="0.7"/>
    <path d="M-90,20 Q-60,0 -40,30 T-70,80 Z" fill="#15803d" fill-opacity="0.75"/>
    
    <!-- Clouds -->
    <path d="M-80,-20 Q-40,-30 0,-15 T50,-25 Q20,-5 -30,-10 Z" fill="#ffffff" fill-opacity="0.55"/>
    <path d="M-30,40 Q10,30 60,45 T10,65 Z" fill="#ffffff" fill-opacity="0.5"/>

    <!-- Atmosphere Glow Overlay -->
    <circle cx="0" cy="0" r="125" fill="url(#atmoGlow)"/>
  </g>
</svg>