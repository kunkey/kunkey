<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 846 150" width="846" height="150" fill="none">
  <defs>
    <linearGradient id="quoteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20232A"/>
      <stop offset="100%" stop-color="#15171C"/>
    </linearGradient>
    <linearGradient id="quoteTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#61dafb"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#4fc08d"/>
    </linearGradient>
  </defs>

  <style>
    .quote-text {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 20px;
      font-weight: 600;
      fill: url(#quoteTextGrad);
      text-anchor: middle;
      dominant-baseline: middle;
    }
  </style>

  <!-- Background Card -->
  <rect width="846" height="150" rx="12" fill="url(#quoteBg)" stroke="#61dafb" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Quote Text -->
  <text x="423" y="75" class="quote-text">"Learning new everyday not the copy cat of yesterday!"</text>
</svg>